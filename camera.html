<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaPipe：手の検出</title>
  <style>
    /* 映像を画面幅に合わせ、鏡のように左右反転する */
    video { width: 100%; transform: scaleX(-1); }
  </style>
</head>
<body>
  <h1>手の検出</h1>
  <button id="start">カメラを開始</button>
  <p id="message">開始ボタンを押してください</p>
  <video id="video" autoplay muted playsinline></video>

  <script type="module">
    // MediaPipeの手の認識機能を読み込む
    import { FilesetResolver, HandLandmarker } from
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

    // HTML内の映像・メッセージ・ボタンをJavaScriptから操作する
    const video = document.getElementById('video');
    const message = document.getElementById('message');
    const button = document.getElementById('start');

    // ボタンを押したときだけカメラと認識処理を開始する
    button.addEventListener('click', async () => {
      // 起動中にボタンを連打しないようにする
      button.disabled = true;
      message.textContent = '準備中…';

      try {
        // カメラを起動する（HTTPS環境と利用許可が必要）
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' } // userは前面カメラ
        });
        await video.play();

        // wasmは認識処理を実行するためのプログラム
        // modelAssetPathは学習済みの「手の認識モデル」の保存先
        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
        );
        const hand = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
          },
          runningMode: 'VIDEO', // 静止画ではなく動画を解析する
          numHands: 1 // 最大1つの手を検出する
        });

        button.hidden = true;
        let lastTime = -1;

        // 動画の各フレームを調べ続ける関数
        function detect() {
          // 同じ映像フレームを繰り返し解析しない
          if (video.readyState >= 2 && video.currentTime !== lastTime) {
            lastTime = video.currentTime;
            // 現在のカメラ映像を解析し、手の特徴点（ランドマーク）を取得する
            const result = hand.detectForVideo(video, performance.now());

            // landmarksは検出した手の特徴点の一覧
            // 1つ以上あれば「手あり」、0なら「手なし」と判定する
            message.textContent = result.landmarks.length > 0
              ? '手を検出'
              : '手は見つかりません';
          }
          // 次の画面更新時にもう一度detectを呼び出す
          requestAnimationFrame(detect);
        }
        detect();
      } catch (error) {
        // カメラの拒否・モデルの読み込み失敗などをまとめて表示する
        message.textContent = '起動できません。カメラの許可とHTTPS接続を確認してください。';
        button.disabled = false;
        console.error(error);
      }
    });
  </script>
</body>
</html>
